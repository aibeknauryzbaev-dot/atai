function limit(){return s.teams.length===2?14:15}function completed(){return s.done.slice(0,limit()).filter(Boolean).length}
function chest(i){let c=i<5?'#23a7c1':i<10?'#2caa7d':'#d9a82b';return `<svg viewBox="0 0 150 105" aria-hidden="true"><ellipse cx="75" cy="95" rx="58" ry="6" fill="#71451c22"/><path d="M19 44L131 44L125 88Q75 101 25 88Z" fill="#975326" stroke="#673717" stroke-width="3"/><path d="M27 51H123V84Q75 94 27 84Z" fill="${c}"/><path d="M36 48V87M113 48V87" stroke="#ffd874" stroke-width="8"/><g class="lid"><path d="M18 45Q16 10 46 10H105Q134 10 132 45Z" fill="#ba793b" stroke="#75451f" stroke-width="3"/><path d="M27 40Q26 18 48 18H104Q123 18 123 40Z" fill="${c}"/><path d="M36 18V43M113 18V43M19 45H131" stroke="#ffd874" stroke-width="7"/><path d="M57 30q8-17 18 0q10-17 18 0q-7 12-18 0q-10 12-18 0" fill="none" stroke="#ffe28a" stroke-width="3"/></g><path d="M65 43H85V65Q75 75 65 65Z" fill="#ffe493" stroke="#d7a12c" stroke-width="2"/><circle cx="75" cy="55" r="4" fill="#6e471e"/><path d="M49 66q9-13 17 0M84 66q9-13 17 0" fill="none" stroke="#ffe28a" stroke-width="3"/></svg>`}
function renderBoard(){s.phase='board';$('app').innerHTML=`<main><div class="scorebar">${s.teams.map((t,i)=>`<div id="score${i}" class="score ${s.turn===i?'active':''}"><div><div class="small muted">${i+1}-топ</div><strong>${esc(t)}</strong></div><strong><span class="coin">₸</span> ${s.scores[i]}</strong></div>`).join('')}</div><div class="boardtitle"><div><div class="eyebrow">Сандықты таңда · Ойлан · Қазына жина</div><h2 style="margin-top:8px">Кезек: ${esc(s.teams[s.turn])} тобы</h2></div><b>${completed()} / ${limit()}<br><span class="small muted">тапсырма аяқталды</span></b></div><div class="progress"><i style="width:${completed()/limit()*100}%"></i></div><div class="levels">${LEVELS.map((l,k)=>`<section class="level"><div class="levelhead"><h3>${l}</h3><span class="small">${k+1} <span class="coin">₸</span></span></div><div class="chests">${QUESTIONS.slice(k*5,k*5+5).map((q,j)=>{let i=k*5+j,bonus=s.teams.length===2&&i===14;return `<button id="chest${i}" class="chestbtn ${s.done[i]?'done':''}" ${s.done[i]||bonus?'disabled':''} onclick="openChest(${i})" aria-label="${i+1}-сандық"><div>${chest(i)}</div><span>${s.done[i]?'✓ Аяқталды':bonus?'★ Қосымша':String(i+1).padStart(2,'0')+' · Ашу'}</span></button>`}).join('')}</div></section>`).join('')}</div><p class="footnote">${s.teams.length===2?'Әр топқа 7 тапсырма. 15-сандық жарыстан кейін бірге ашылады.':'Әр топқа 5 тапсырма.'} Дұрыс жауап: 1 / 2 / 3 теңге. Бағаны мұғалім қояды.</p></main>`}
function openChest(i){if(opening||s.active!==null||s.done[i]||i>=limit())return;opening=true;tone('open');$('chest'+i).classList.add('opening');s.active=i;s.awarded=false;setTimeout(()=>{opening=false;selected=-1;checked=false;showSample=false;retry=false;question()},650)}
function modal(html){if($('overlay').classList.contains('hidden'))previousFocus=document.activeElement;$('overlay').innerHTML='<div class="modal">'+html+'</div>';$('overlay').classList.remove('hidden');$('overlay').querySelector('button,input')?.focus()}
function closeModal(){$('overlay').classList.add('hidden');$('overlay').innerHTML='';extra=null;previousFocus?.focus?.()}
function current(){return extra?extra.q:QUESTIONS[s.active]}
function question(){const q=current(),i=extra?14:s.active,k=Math.floor(i/5),finished=!extra&&s.awarded;modal(`<div class="row" style="justify-content:space-between"><span class="eyebrow">${extra?'Ортақ қосымша тапсырма':LEVELS[k]+' · '+(i+1)+' / 15'}</span><b>${extra?'Ұпайға әсер етпейді':esc(s.teams[s.turn])+' · '+(k+1)+' теңге'}</b></div><h2 class="question">${esc(q.q)}</h2>${q.options?`<div class="answers">${q.options.map((o,j)=>`<button class="answer ${selected===j?'selected':''} ${checked?(j===q.correct?'right':selected===j?'wrong':''):''}" onclick="selectAnswer(${j})" ${checked||finished?'disabled':''}>${['А','Ә','Б'][j]}) ${esc(o)}</button>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="checkAnswer()" ${selected<0||checked||finished?'disabled':''}>ЖАУАПТЫ ТЕКСЕРУ</button>`:`<p class="muted">Жауабыңды ауызша айт. ${k===2?'Ойыңды дәлелдеп, кемінде бір көркем тіркес қолдан.':'Өмірлік жағдаяттың шешімін түсіндір.'}</p>${k===2?`<div class="support" style="margin-top:15px">${WORDS.map(w=>'<span>'+w+'</span>').join('')}</div>`:''}<button style="margin-top:18px" onclick="showSample=!showSample;question()">${showSample?'Үлгіні жасыру':'МҰҒАЛІМГЕ АРНАЛҒАН ЖАУАП ҮЛГІСІ'}</button>`}${showSample||checked?`<div class="sample"><b>Жауап үлгісі:</b> ${esc(q.sample)}<br><b>Дескриптор:</b> ${k===0?'дұрыс жауапты анықтайды.':k===1?'орынды әрекет ұсынады; сыпайылық пен қауіпсіздікті ескереді.':'пікірін білдіреді; ойын дәлелдейді; кемінде бір көркем тіркес қолданады.'}${i===14?' Үш байланысты сөйлем құрастырады.':''}<br><span class="small">Мағынасы сәйкес өзге жауаптар да қабылданады.</span></div>`:''}${retry?'<div class="status">Толықтыру қажет. Қазір теңге берілген жоқ. Оқушы жауабын толықтырсын.</div><button class="gold" onclick="retryAnswer()">ҚАЙТА ЖАУАП БЕРУ</button>':''}${finished?`<div class="status">${s.done[i].points?'Жарайсыңдар! +'+s.done[i].points+' алтын теңге.':'Тапсырма аяқталды. Келесі сандықта сәттілік!'}</div><button class="primary wide" onclick="next()">КЕЛЕСІ ТАПСЫРМА →</button>`:extra?'<div class="actions"><button class="primary" onclick="closeModal()">ТАЛҚЫЛАУДЫ АЯҚТАУ</button></div>':`<div class="actions"><button class="primary" onclick="grade(true)" ${q.options&&!checked?'disabled':''}>ДҰРЫС ЖАУАП</button><button class="gold" onclick="needsMore()">ТОЛЫҚТЫРУ ҚАЖЕТ</button><button onclick="grade(false)">ЖАУАП БЕРЕ АЛМАДЫ</button></div><p class="small muted" style="margin-top:12px">${q.options?'Тексергеннен кейін қорытынды бағаны мұғалім белгілейді.':'Мұғалім дескриптор бойынша бағалайды.'}</p>`}`)}
function selectAnswer(j){if(checked||s.awarded)return;selected=j;question()}function checkAnswer(){if(selected<0||checked)return;checked=true;question()}function needsMore(){retry=true;question()}function retryAnswer(){retry=false;selected=-1;checked=false;showSample=false;question()}
function grade(ok){if(s.active===null||s.awarded||s.done[s.active])return;let i=s.active,points=ok?Math.floor(i/5)+1:0;s.done[i]={team:s.turn,points};s.scores[s.turn]+=points;s.awarded=true;question();if(points){tone('coin');flyCoins(points,s.turn)}}
function flyCoins(n,team){const target=$('score'+team)?.getBoundingClientRect();if(!target)return;for(let j=0;j<n+3;j++){let e=document.createElement('span');e.className='coin fly';e.textContent='₸';e.style.left=innerWidth/2+j*12+'px';e.style.top=innerHeight*.58+'px';e.style.setProperty('--dx',target.x+target.width*.8-innerWidth/2+'px');e.style.setProperty('--dy',target.y-innerHeight*.58+'px');e.style.animationDelay=j*.06+'s';document.body.append(e);setTimeout(()=>e.remove(),1500)}}
function next(){if(!s.awarded)return;s.active=null;s.awarded=false;s.turn=(s.turn+1)%s.teams.length;closeModal();if(completed()===limit()){results();tone('win')}else renderBoard()}
function editScores(){if(!s){toast('Алдымен ойынды бастаңыз.');return}if(s.active!==null&&!s.awarded){toast('Алдымен ашылған тапсырманы бағалаңыз.');return}modal(`<h2>Ұпайды түзету</h2><p class="muted">Қорытынды теңге санын енгізіңіз. Сандықтар қайта ашылмайды.</p>${s.teams.map((t,i)=>`<label class="editrow">${esc(t)}<input id="edit${i}" type="number" min="0" max="999" step="1" value="${s.scores[i]}"></label>`).join('')}<div class="actions"><button class="primary" onclick="saveScores()">САҚТАУ</button><button onclick="cancelEdit()">Бас тарту</button></div>`)}
function cancelEdit(){closeModal();if(s.active!==null)question()}function saveScores(){let v=s.teams.map((_,i)=>Number($('edit'+i).value));if(v.some(x=>!Number.isInteger(x)||x<0||x>999)){toast('0–999 аралығындағы бүтін сан енгізіңіз.');return}s.history.push({before:[...s.scores],after:v,date:new Date().toISOString()});s.scores=v;closeModal();resume()}
function results(){s.phase='results';let max=Math.max(...s.scores),w=s.teams.filter((_,i)=>s.scores[i]===max);$('app').innerHTML=`<section class="results"><div class="eyebrow">Даналық бәйгесі аяқталды!</div><div class="trophy">🏆</div><h2>ЖАРАЙСЫҢДАР, БІЛІМПАЗДАР!</h2><p style="font-size:24px">${w.length>1?'Тең жеңімпаздар':'Жеңімпаз'}: <b>${w.map(esc).join(', ')}</b></p><div class="podium">${s.teams.map((t,i)=>`<article class="${s.scores[i]===max?'winner':''}"><h3>${esc(t)}</h3><b>${s.scores[i]} <span class="coin">₸</span></b><p>Алтын теңге: ${s.scores[i]}<br>Жалпы ұпай: ${s.scores[i]}<br><span class="small muted">Тапсырма: ${s.done.filter(d=>d&&d.team===i).length}</span></p></article>`).join('')}</div><p style="font-size:23px">Нағыз қазына – білім мен үлкенге құрмет!</p><div class="row" style="justify-content:center;margin-top:25px">${s.teams.length===2?'<button class="gold" onclick="bonus()">★ 15-сандықты бірге ашу</button>':''}<button onclick="tieQuestion()">Қосымша шешуші сұрақ</button><button class="primary" onclick="feedback()">ДАНАЛЫҚ ЖАПЫРАҚТАРЫ →</button></div></section>`}
function bonus(){extra={q:QUESTIONS[14]};showSample=false;retry=false;question()}
function tieQuestion(){modal('<h2>Қосымша шешуші сұрақ</h2><p class="sample">Әр тең түскен топқа бірдей мүмкіндік беріңіз. Жауаптарды тыңдап, қажет болса «Ұпайды түзету» арқылы қорытынды ұпайды өзгертіңіз.</p><label>Мұғалімнің сұрағы<input id="custom" value="Қарияға қамқорлық туралы бағалау сұрағын қойып, оған өз жауабыңды дәлелде." style="margin-top:12px"></label><div class="actions"><button class="primary" onclick="showTie()">СҰРАҚТЫ КӨРСЕТУ</button><button onclick="closeModal()">Жабу</button></div>')}
function showTie(){let q=$('custom').value.trim();if(!q)return;modal(`<div class="eyebrow">Барлық тең түскен топқа бірдей сұрақ</div><h2 class="question">${esc(q)}</h2><p class="sample">Бағалау: орынды сұрақ қояды, пікірін дәлелдейді, көркем тіркес қолданады. Мұғалімнің шешімі бойынша қосымша 1 теңге.</p><button class="primary" onclick="closeModal();editScores()">ҰПАЙДЫ ТҮЗЕТУ</button><button onclick="closeModal()">Жабу</button>`)}
function feedback(){s.phase='feedback';$('app').innerHTML=`<section class="feedback"><div class="eyebrow">Әр жапырақ — сенің ойың</div><h2 style="margin:10px">ДАНАЛЫҚ ЖАПЫРАҚТАРЫ</h2><p>Өзіңе сәйкес жапырақты бір рет таңда. Жарыс ұпайы өзгермейді.</p><div class="tree" id="tree"><svg viewBox="0 0 620 340" aria-hidden="true"><ellipse cx="310" cy="320" rx="210" ry="15" fill="#cfdfbb"/><path d="M279 320L295 145H325L341 320Z" fill="#9d673c"/><path d="M306 240L230 160M315 217L400 135" stroke="#9d673c" stroke-width="17" stroke-linecap="round"/><g fill="#c4dfb0"><circle cx="235" cy="130" r="92"/><circle cx="365" cy="125" r="102"/><circle cx="300" cy="80" r="70"/><circle cx="427" cy="178" r="65"/><circle cx="190" cy="190" r="62"/></g><g fill="#b3d69c"><circle cx="280" cy="175" r="75"/><circle cx="365" cy="190" r="65"/></g></svg><div id="dots"></div></div><div class="leaves">${['Мен бәрін түсіндім!','Менің сұрағым бар!','Маған көмек керек!'].map((t,i)=>`<button class="${['leafgreen','leafyellow','leafred'][i]}" onclick="addLeaf(${i})">❧ ${t}<br><b id="leafcount${i}">${s.leaves[i]}</b> оқушы</button>`).join('')}</div><div class="row" style="justify-content:center;margin-top:20px"><button onclick="undoLeaf()">Соңғы жапырақты қайтару</button><button onclick="results()">← Нәтижелер</button><button onclick="restart()">Жаңа ойын</button></div></section>`;drawLeaves()}
function drawLeaves(){let n=0;$('dots').innerHTML=s.leaves.map((count,k)=>Array.from({length:Math.min(count,80)},()=>{let a=n++*2.399,r=9+Math.sqrt(n/240)*32,x=50+Math.cos(a)*r,y=42+Math.sin(a)*r*.85;return `<span class="leafdot" style="left:${x}%;top:${y}%;background:${['#228f52','#eebc24','#db6b5b'][k]}"></span>`}).join('')).join('')}
function addLeaf(i){s.leaves[i]++;s.leafHistory??=[];s.leafHistory.push(i);$('leafcount'+i).textContent=s.leaves[i];drawLeaves();tone('open')}function undoLeaf(){let i=s.leafHistory?.pop();if(i===undefined)return;s.leaves[i]=Math.max(0,s.leaves[i]-1);feedback()}
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&!$('overlay').classList.contains('hidden')){const a=[...$('overlay').querySelectorAll('button:not(:disabled),input')];if(!a.length)return;if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});window.addEventListener('pageshow', event => {
  if (event.persisted) window.location.reload();
});
renderHome();
</script></html>
